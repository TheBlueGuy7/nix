# Hyprland minimal developer config
# Reference: https://wiki.hypr.land/Configuring/

################
### MONITORS ###
################

monitor = eDP-1, preferred, 0x0, 1
monitor = , preferred, auto, 1


###################
### MY PROGRAMS ###
###################

$terminal   = ghostty
$fileManager = thunar
$menu       = rofi -show drun -show-icons
$browser    = chromium
$screenshot = hyprshot -m region -z -o ~/Pictures/Screenshots


#################
### AUTOSTART ###
#################

exec-once = /run/current-system/sw/libexec/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = hypridle
exec-once = awww-daemon
exec-once = awww img ~/.wallpapers/nathan-anderson-iYO-EGosrCo-unsplash.jpg --transition-type none


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,BreezeX-RosePine-Linux
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_STYLE_OVERRIDE,Adwaita-Dark


#####################
### LOOK AND FEEL ###
#####################

# Developer palette — neutral dark, single soft-blue accent.
# Used by hyprland (col.*) and mirrored in waybar/rofi/hyprlock CSS.
# $surface     #0f1115    window bg / inactive border
# $surface2    #1b1e25    selected / hover
# $text        #cdd6e1
# $subtext     #888888
# $accent      #7aa2f7    focused workspace / active border
# $urgent      #b85a5a

general {
    gaps_in  = 0
    gaps_out = 0

    border_size = 2

    col.active_border   = rgb(35373d)
    col.inactive_border = rgb(1b1e25)

    resize_on_border = false
    allow_tearing    = false
    layout = dwindle
}

group {
    col.border_active         = rgb(35373d)
    col.border_inactive       = rgb(1b1e25)
    col.border_locked_active  = rgb(b85a5a)
    col.border_locked_inactive= rgb(1b1e25)

    groupbar {
        col.active          = rgb(35373d)
        col.inactive        = rgb(1b1e25)
        col.locked_active   = rgb(b85a5a)
        col.locked_inactive = rgb(1b1e25)
    }
}

decoration {
    # Pointy corners — developer wanted sharp, no rounding.
    rounding = 0

    active_opacity   = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = 0xee010409
    }

    blur {
        enabled = false
    }
}

# Animations: explicitly disabled for snappy/linear feel.
animations {
    enabled = no
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_rules =
    kb_options = compose:ralt

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Apps / session
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bindl = $mainMod ALT, M, exec, poweroff
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, T, layoutmsg, togglesplit
bind = $mainMod, SPACE, exec, $menu
bind = , PRINT, exec, $screenshot
bind = $mainMod, L, exec, hyprlock

# Move focus
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, minus, workspace, -1
bind = $mainMod, equal, workspace, +1

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, minus, movetoworkspace, -1
bind = $mainMod SHIFT, equal, movetoworkspace, +1

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod CTRL, S, movetoworkspace, special:magic

# Scroll through workspaces with SUPER + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Move / resize windows with SUPER + LMB/RMB drag
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Resize active window with mainMod + SHIFT + arrows
binde = $mainMod SHIFT, left,  resizeactive, -50 0
binde = $mainMod SHIFT, right, resizeactive,  50 0
binde = $mainMod SHIFT, up,    resizeactive, 0 -50
binde = $mainMod SHIFT, down,  resizeactive, 0  50

# Swap / move active window with mainMod + ALT + arrows
bind  = $mainMod ALT, left,  swapwindow, l
binde = $mainMod ALT, left,  moveactive, -50 0
bind  = $mainMod ALT, right, swapwindow, r
binde = $mainMod ALT, right, moveactive,  50 0
bind  = $mainMod ALT, up,    swapwindow, u
binde = $mainMod ALT, up,    moveactive, 0 -50
bind  = $mainMod ALT, down,  swapwindow, d
binde = $mainMod ALT, down,  moveactive, 0  50

# Move current workspace between monitors
bind = $mainMod CTRL, left,  movecurrentworkspacetomonitor, l
bind = $mainMod CTRL, right, movecurrentworkspacetomonitor, r

# Volume / brightness (locked + repeating)
bindel = , XF86AudioRaiseVolume,   exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,   exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,          exec, wpctl set-mute @DEFAULT_SINK@ toggle
bindl  = , XF86AudioMicMute,       exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Media keys (work while screen is locked)
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Suppress maximize events for all windows
windowrule = match:class .*, suppress_event maximize

# XWayland drag fixes
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus on

# JetBrains suite fixes
windowrule = match:class ^jetbrains-[^t].*, match:float true, no_initial_focus on
windowrule = match:class ^jetbrains-[^t].*, match:float true, stay_focused on
windowrule = match:class ^jetbrains-[^t].*, match:title ^win\d+$, no_focus on
