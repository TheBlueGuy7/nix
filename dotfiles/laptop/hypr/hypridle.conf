# hypridle — idle timeouts
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = killall -s SIGUSR1 hyprlock
    before_sleep = lock_cmd
    after_sleep = unlock_cmd
}

# Lock after 5 minutes
listener {
    timeout = 300
    on-timeout = lock_cmd
}

# Turn off screen after 10 minutes
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 60 minutes
listener {
    timeout = 3600
    on-timeout = systemctl suspend
    on-resume = hyprctl dispatch dpms on
}
