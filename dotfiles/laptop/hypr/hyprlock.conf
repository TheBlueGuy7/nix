# hyprlock — minimal dark lock screen
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

background {
    monitor =
    path = ~/.config/hypr/wallpaper/nathan-anderson-iYO-EGosrCo-unsplash.jpg
    blur_size = 5
    blur_passes = 2
    brightness = 0.4
}

# Time (big, centered)
label {
    monitor =
    text = $TIME
    text_align = center
    color = rgb(cdd6e1)
    font_size = 120
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Date (under the time)
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    text_align = center
    color = rgb(888888)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# Input prompt
input-field {
    monitor =
    size = 280, 40
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(1b1e25)
    inner_color = rgb(0f1115)
    font_color = rgb(cdd6e1)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Enter password</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}
